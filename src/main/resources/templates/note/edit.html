<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование заметки</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea { width: 300px; padding: 8px; }
        .btn-save { background-color: #008CBA; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        .btn-cancel { background-color: #e7e7e7; color: black; padding: 10px 15px; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>

<h2>Редактировать заметку</h2>

<form th:action="@{/note/edit}" th:object="${note}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="title">Название:</label>
        <input type="text" id="title" th:field="*{title}" required />
    </div>

    <div class="form-group">
        <label for="content">Содержимое:</label>
        <textarea id="content" th:field="*{content}" rows="5" required></textarea>
    </div>

    <button type="submit" class="btn btn-save">Сохранить изменения</button>
    <a th:href="@{/note/list}" class="btn btn-cancel">Отмена</a>
</form>

</body>
</html>
