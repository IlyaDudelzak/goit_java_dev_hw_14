<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список заметок</title>
    <style>
        table { width: 60%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border: none; cursor: pointer; }
        .btn-edit { background-color: #4CAF50; }
        .btn-delete { background-color: #f44336; }
        .inline-form { display: inline; }
    </style>
</head>
<body>

<h2>Управление заметками</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Содержимое</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="note : ${notes}">
        <td th:text="${note.id}">1</td>
        <td th:text="${note.title}">Название</td>
        <td th:text="${note.content}">Контент</td>
        <td>
            <a th:href="@{/note/edit(id=${note.id})}" class="btn btn-edit">Редактировать</a>

            <form th:action="@{/note/delete}" method="post" class="inline-form">
                <input type="hidden" name="id" th:value="${note.id}"/>
                <button type="submit" class="btn btn-delete" onclick="return confirm('Удалить эту заметку?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
